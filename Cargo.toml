[package]
name = "subforge-rs"
version = "0.1.0"
edition = "2024"
description = "SubForge.rs — Clash 订阅合并与配置编排服务"
license = "AGPL-3.0-only"

[dependencies]
axum = { version = "0.8", features = ["form", "macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "gzip",
    "brotli",
    "deflate",
    "charset",
] }
askama = "0.14"
tower-http = { version = "0.6", features = ["fs"] }
regex = "1"
maxminddb = "0.26"
# GeoIP 库由 DB-IP 以 `.mmdb.gz` 分发；reqwest 的 gzip 特性只处理
# Content-Encoding，不处理 .gz 文件体，因此需要显式解压。
flate2 = "1"
humantime = "2"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 2
