[package]
name = "subforge-rs"
version = "0.1.0"
edition = "2024"
description = "SubForge.rs — Clash 订阅合并与配置编排服务"
license = "AGPL-3.0-only"

[lib]
name = "subforge_rs"
# wasm 目标需要 cdylib（worker-build 产出 shim）；native 仍用 rlib 给 bin/测试。
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "subforge-rs"
path = "src/main.rs"

# ---------------------------------------------------------------- 两个目标共用
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
askama = "0.14"
regex = "1"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"

# ---------------------------------------------------------------- native（默认）
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.8", features = ["form", "macros"] }
tokio = { version = "1", features = ["full"] }
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "gzip",
    "brotli",
    "deflate",
    "charset",
] }
tower-http = { version = "0.6", features = ["fs"] }
maxminddb = "0.26"
# GeoIP 库由 DB-IP 以 `.mmdb.gz` 分发；reqwest 的 gzip 特性只处理
# Content-Encoding，不处理 .gz 文件体，因此需要显式解压。
flate2 = "1"
humantime = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ---------------------------------------------------------------- wasm32（Cloudflare Workers）
[target.'cfg(target_arch = "wasm32")'.dependencies]
# axum 默认特性含 tokio/serve，wasm 上没有 TcpListener，必须关掉。
axum = { version = "0.8", default-features = false, features = [
    "form",
    "http1",
    "query",
] }
# 只用运行时无关的同步原语（锁 / Semaphore / OnceCell）。
tokio = { version = "1", default-features = false, features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
worker = { version = "0.8", features = ["http"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# rand 0.8 通过 getrandom 取随机数；wasm 上必须用 js 后端。
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = 2
